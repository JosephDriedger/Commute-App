<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign Up · Commute!</title>
    <meta name="comp1800 template" content="Commute!" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/icon.png" />

    <!-- Bootstrap Library CSS CDN go here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <!-- Boostrap Library JS CDN  go here -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-------------------------------------------------------->
    <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
    <!-------------------------------------------------------->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/theme.js"></script>
</head>

<body>
    <!-- navbar placeholder -->
    <nav id="navbarPlaceholder"></nav>

    <main class="auth-wrap">
        <div class="auth-card">
            <img src="img/icon.png" width="64" height="64" alt="Commute! logo" />
            <h1>Create Your Account</h1>
            <p>Enter your email and choose a password. It takes less than a minute.</p>
            <div class="surface text-start">
                <form id="signupForm" onsubmit="createAccount(event)">
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="nameInput" placeholder="Alex Chen" autocomplete="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email</label>
                        <input type="email" class="form-control" id="emailInput" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">Password</label>
                        <div class="password-field">
                            <input type="password" class="form-control" id="passwordInput" autocomplete="new-password"
                                oninput="checkPasswords()" required>
                            <button type="button" class="btn btn-ghost btn-sm" onclick="togglePasswordVisibility()"
                                title="Show or Hide Password" aria-label="Show or Hide Password">
                                <span class="material-symbols-rounded" id="togglePassword">visibility</span>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmInput" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmInput" autocomplete="new-password"
                            oninput="checkPasswords()" required>
                    </div>

                    <ul class="password-rules">
                        <li id="ruleLength"><span class="material-symbols-rounded">check_circle</span>At least 6 characters</li>
                        <li id="ruleMatch"><span class="material-symbols-rounded">check_circle</span>Both passwords match</li>
                    </ul>

                    <p class="signup-message" id="signupMessage" hidden></p>

                    <button type="submit" class="btn btn-primary w-100" id="createAccountButton">Create Account</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="./login">Log In</a></p>
            </div>
        </div>
    </main>

    <!-- copyright footer -->
    <footer id="footerPlaceholder"></footer>

    <!-- Link to scripts of your own -->
    <script src="./js/firebaseAPI_TEAM31.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/signup.js"></script>
    <script src="./js/skeleton.js"></script>
</body>

</html>
