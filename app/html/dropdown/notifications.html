<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Alerts · Commute!</title>
        <meta name="comp1800 template" content="Commute!" />

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="img/icon.png" />

        <!-- Bootstrap Library CSS CDN go here -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
        <!-- Boostrap Library JS CDN  go here -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

        <!-------------------------------------------------------->
        <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
        <!-------------------------------------------------------->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

        <!-- Link to styles of your own -->
        <link rel="stylesheet" href="./css/style.css">
        <script src="./js/theme.js"></script>
        <link rel="stylesheet" href="./css/style_notifications.css">
    </head>

    <body>
        <template id="notificationTemplate">
            <div class="surface notification">
                <span class="icon-tile danger"><span class="material-symbols-rounded">warning</span></span>
                <div class="notification-body">
                    <h2 class="notify-head">Your Routes Are Impacted</h2>
                    <p class="notify-description"></p>
                    <div class="notify-tip">
                        <span class="material-symbols-rounded">lightbulb</span>
                        <span class="notify-suggestion"></span>
                    </div>
                </div>
                <button type="button" class="btn btn-ghost btn-sm notify-dismiss" title="Dismiss Alert" aria-label="Dismiss Alert">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
        </template>

        <!-- navbar -->
        <nav id="navbarPlaceholder"></nav>

        <main class="page page-narrow">
            <div class="page-header">
                <div>
                    <h1>Alerts</h1>
                    <p>Incidents that could affect your routes.</p>
                </div>
            </div>

            <form id="notification-head" class="surface setting-row" onsubmit="return false;">
                <span class="icon-tile"><span class="material-symbols-rounded">notifications_active</span></span>
                <label for="turnOnNotifications" class="toggle" id="switch-label">
                    <strong>Push Notifications</strong>
                    <span class="d-block text-muted small">Get notified as soon as an incident is reported.</span>
                </label>
                <div class="form-check form-switch">
                    <input type="checkbox" id="turnOnNotifications" class="form-check-input" role="switch" onclick="saveNotifications()"/>
                </div>
            </form>

            <div class="section-title">Recent Activity</div>
            <div id="notification-group" class="notification-list"></div>
            <div id="notification-none" class="empty-state" hidden>
                <span class="icon-tile accent"><span class="material-symbols-rounded">check_circle</span></span>
                <h2>All Clear</h2>
                <p class="mb-0">No incidents on your routes right now.</p>
            </div>
        </main>

        <!-- copyright footer -->
        <footer id="footerPlaceholder"></footer>

        <!-- Link to scripts of your own -->
        <script src="./js/firebaseAPI_TEAM31.js"></script>
        <script src="./js/script.js"></script>
        <script src="./js/skeleton.js"></script>
        <script src="./js/notifications.js"></script>
    </body>

</html>
