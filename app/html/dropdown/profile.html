<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Profile · Commute!</title>
        <meta name="comp1800 template" content="Commute!" />

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="img/icon.png" />

        <!-- Bootstrap Library CSS CDN go here -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
        <!-- Boostrap Library JS CDN  go here -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

        <!-------------------------------------------------------->
        <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
        <!-------------------------------------------------------->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

        <!-- Link to styles of your own -->
        <link rel="stylesheet" href="./css/style.css">
        <script src="./js/theme.js"></script>
    </head>

    <body>
        <!-- Navbar -->
        <nav id="navbarPlaceholder"></nav>

        <!-- Content -->
        <main class="page page-narrow">
            <div class="page-header">
                <div>
                    <h1>Profile</h1>
                    <p>Your details help us personalize your commute.</p>
                </div>
            </div>
            <form class="surface" onsubmit="return false;">
                <fieldset id="personalInfoFields" disabled>
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="nameInput" class="form-label">Name</label>
                            <input type="text" id="nameInput" class="form-control" placeholder="Enter your name">
                        </div>
                        <div class="col-sm-6">
                            <label for="phoneNumInput" class="form-label">Phone Number</label>
                            <input type="tel" id="phoneNumInput" class="form-control" placeholder="604-555-0123">
                        </div>
                        <div class="col-sm-6">
                            <label for="transportInput" class="form-label">Main Method of Transportation</label>
                            <input type="text" id="transportInput" class="form-control" placeholder="e.g. SkyTrain" list="transportOptions">
                            <datalist id="transportOptions">
                                <option value="Drive">
                                <option value="Bike">
                                <option value="Bus or SkyTrain">
                                <option value="Walk">
                            </datalist>
                        </div>
                        <div class="col-sm-4">
                            <label for="cityInput" class="form-label">City</label>
                            <input type="text" id="cityInput" class="form-control" placeholder="Burnaby">
                        </div>
                        <div class="col-sm-4">
                            <label for="provinceInput" class="form-label">State/Province</label>
                            <input type="text" id="provinceInput" class="form-control" placeholder="BC">
                        </div>
                        <div class="col-sm-4">
                            <label for="countryInput" class="form-label">Country</label>
                            <input type="text" id="countryInput" class="form-control" placeholder="Canada">
                        </div>
                    </div>
                </fieldset>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn btn-light" onclick="editUserInfo()">
                        <span class="material-symbols-rounded">edit</span> Edit
                    </button>
                    <button type="button" class="btn btn-primary" onclick="saveUserInfo()">Save</button>
                </div>
            </form>
        </main>

        <!-- copyright footer -->
        <footer id="footerPlaceholder"></footer>

        <!-- Link to scripts of your own -->
        <script src="./js/firebaseAPI_TEAM31.js"></script>
        <script src="./js/script.js"></script>
        <script src="./js/skeleton.js"></script>
        <script src="./js/profile.js"></script>
    </body>

</html>
