<!DOCTYPE html>
<html lang="en">

<head>
  <title>Schedule · Commute!</title>
  <meta name="comp1800 template" content="Commute!" />

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="img/icon.png" />

  <!-- Bootstrap Library CSS CDN go here -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <!-- Boostrap Library JS CDN  go here -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <!-------------------------------------------------------->
  <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
  <!-------------------------------------------------------->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

  <!-- Link to styles of your own -->
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/theme.js"></script>
  <link rel="stylesheet" href="./css/style_schedule.css">
</head>

<body>
  <nav id="navbarPlaceholder"></nav>

  <main class="page page-wide">
    <div class="page-header">
      <div>
        <h1>Schedule</h1>
        <p>Your week at a glance. Trips can repeat every week.</p>
      </div>
      <button class="btn btn-primary" type="button" onclick="openScheduleForm()">
        <span class="material-symbols-rounded">add</span> Add Trip
      </button>
    </div>

    <div class="week-bar">
      <button class="btn btn-ghost btn-sm" type="button" onclick="showWeek(-1)" title="Previous Week" aria-label="Previous Week">
        <span class="material-symbols-rounded">chevron_left</span>
      </button>
      <strong id="weekLabel"></strong>
      <button class="btn btn-ghost btn-sm" type="button" onclick="showWeek(1)" title="Next Week" aria-label="Next Week">
        <span class="material-symbols-rounded">chevron_right</span>
      </button>
      <button class="btn btn-light btn-sm ms-auto" type="button" onclick="showThisWeek()">This Week</button>
    </div>

    <template id="tripChipTemplate">
      <article class="trip-chip">
        <div class="chip-head">
          <span class="chip-time"></span>
          <span class="material-symbols-rounded chip-mode">route</span>
          <span class="material-symbols-rounded chip-repeat" title="Repeats Weekly">repeat</span>
          <button type="button" class="btn btn-ghost btn-sm chip-delete" title="Delete Trip" aria-label="Delete Trip">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>
        <h2 class="chip-destination"></h2>
        <span class="chip-leave"></span>
      </article>
    </template>

    <div id="weekGrid" class="week-grid"></div>

    <div id="week-empty" class="empty-state mt-3" hidden>
      <span class="icon-tile accent"><span class="material-symbols-rounded">calendar_month</span></span>
      <h2>Nothing Planned This Week</h2>
      <p>Add a trip to any day, and tick Repeat Weekly for the ones you make every week.</p>
      <button class="btn btn-primary" type="button" onclick="openScheduleForm()">
        <span class="material-symbols-rounded">add</span> Add a Trip
      </button>
    </div>
  </main>

  <!-- Add schedule form -->
  <div id="id_add" class="modal fade" tabindex="-1" aria-labelledby="scheduleFormTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <form id="scheduleForm" class="modal-content" onsubmit="saveSchedule(event)">
        <div class="modal-header">
          <h5 class="modal-title" id="scheduleFormTitle">Add Schedule</h5>
          <button type="button" class="btn-close" aria-label="Close" onclick="closeScheduleForm()"></button>
        </div>
        <div class="modal-body">
          <div class="step"><span class="step-num">1</span>Date &amp; Time</div>
          <div class="row g-3 mb-4">
            <div class="col-sm-6">
              <label for="dateInput" class="form-label">Date</label>
              <input id="dateInput" class="form-control" type="date" required>
            </div>
            <div class="col-sm-6">
              <label for="timeInput" class="form-label">Time</label>
              <input id="timeInput" class="form-control" type="time" required>
            </div>
            <div class="col-12">
              <label for="timezoneInput" class="form-label">Timezone</label>
              <select name="timezone" id="timezoneInput" class="form-select" required>
                <option value="-12">
                  (GMT -12:00) Eniwetok, Kwajalein
                </option>
                <option value="-11">
                  (GMT -11:00) Midway Island, Samoa
                </option>
                <option value="-10">
                  (GMT -10:00) Hawaii
                </option>
                <option value="-9">
                  (GMT -9:00) Alaska
                </option>
                <option selected="selected" value="-8">
                  (GMT -8:00) Pacific Time (US &amp; Canada)
                </option>
                <option value="-7">
                  (GMT -7:00) Mountain Time (US &amp; Canada)
                </option>
                <option value="-6">
                  (GMT -6:00) Central Time (US &amp; Canada),
                  Mexico City
                </option>
                <option value="-5">
                  (GMT -5:00) Eastern Time (US &amp; Canada),
                  Bogota, Lima
                </option>
                <option value="-4.5">
                  (GMT -4:30) Caracas
                </option>
                <option value="-4">
                  (GMT -4:00) Atlantic Time (Canada), La Paz,
                  Santiago
                </option>
                <option value="-3.5">
                  (GMT -3:30) Newfoundland
                </option>
                <option value="-3">
                  (GMT -3:00) Brazil, Buenos Aires, Georgetown
                </option>
                <option value="-2">
                  (GMT -2:00) Mid-Atlantic
                </option>
                <option value="-1">
                  (GMT -1:00 hour) Azores, Cape Verde Islands
                </option>
                <option value="0">
                  (GMT) Western Europe Time, London, Lisbon,
                  Casablanca, Greenwich
                </option>
                <option value="1">
                  (GMT +1:00 hour) Brussels, Copenhagen, Madrid,
                  Paris
                </option>
                <option value="2">
                  (GMT +2:00) Kaliningrad, South Africa, Cairo
                </option>
                <option value="3">
                  (GMT +3:00) Baghdad, Riyadh, Moscow, St.
                  Petersburg
                </option>
                <option value="3.5">
                  (GMT +3:30) Tehran
                </option>
                <option value="4">
                  (GMT +4:00) Abu Dhabi, Muscat, Yerevan, Baku,
                  Tbilisi
                </option>
                <option value="4.5">
                  (GMT +4:30) Kabul
                </option>
                <option value="5">
                  (GMT +5:00) Ekaterinburg, Islamabad, Karachi,
                  Tashkent
                </option>
                <option value="5.5">
                  (GMT +5:30) Mumbai, Kolkata, Chennai, New Delhi
                </option>
                <option value="5.75">
                  (GMT +5:45) Kathmandu
                </option>
                <option value="6">
                  (GMT +6:00) Almaty, Dhaka, Colombo
                </option>
                <option value="6.5">
                  (GMT +6:30) Yangon, Cocos Islands
                </option>
                <option value="7">
                  (GMT +7:00) Bangkok, Hanoi, Jakarta
                </option>
                <option value="8">
                  (GMT +8:00) Beijing, Perth, Singapore, Hong
                  Kong
                </option>
                <option value="9">
                  (GMT +9:00) Tokyo, Seoul, Osaka, Sapporo,
                  Yakutsk
                </option>
                <option value="9.5">
                  (GMT +9:30) Adelaide, Darwin
                </option>
                <option value="10">
                  (GMT +10:00) Eastern Australia, Guam,
                  Vladivostok
                </option>
                <option value="11">
                  (GMT +11:00) Magadan, Solomon Islands, New
                  Caledonia
                </option>
                <option value="12">
                  (GMT +12:00) Auckland, Wellington, Fiji,
                  Kamchatka
                </option>
              </select>
            </div>
          </div>

          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" id="repeatWeekly">
            <label class="form-check-label" for="repeatWeekly">Repeat Every Week</label>
          </div>

          <div class="step"><span class="step-num">2</span>Route Information</div>
          <div class="row g-3 mb-4">
            <div class="col-12" id="routePickerWrap" hidden>
              <label for="routePicker" class="form-label">Use a Saved Route</label>
              <select id="routePicker" class="form-select" onchange="applyRouteChoice()">
                <option value="">Enter a destination myself</option>
              </select>
              <small class="text-muted">Picking a route lets us tell you when to leave.</small>
            </div>
            <div class="col-sm-8">
              <label for="address" class="form-label">Your Destination</label>
              <input required placeholder="3700 Willingdon Ave, Burnaby" id="address" class="form-control" type="text">
            </div>
            <div class="col-sm-4">
              <label for="postCode" class="form-label">Post Code</label>
              <input id="postCode" class="form-control" type="text" placeholder="V5G 3H2" required>
            </div>
            <div class="col-12">
              <label for="tripCode" class="form-label">Trip Mode</label>
              <select id="tripCode" class="form-select" required>
                <option value="Drive">Drive</option>
                <option value="Bike">Bike</option>
                <option value="Bus or SkyTrain">Bus or SkyTrain</option>
                <option value="Walk">Walk</option>
              </select>
            </div>
          </div>

          <div class="step"><span class="step-num">3</span>Notes</div>
          <textarea id="noteInput" class="form-control" placeholder="e.g. Bring laptop, meet Sam at the station" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-light" type="button" onclick="closeScheduleForm()">Cancel</button>
          <button class="btn btn-primary" type="submit" id="saveScheduleButton">Save Schedule</button>
        </div>
      </form>
    </div>
  </div>

  <!-- copyright footer -->
  <footer id="footerPlaceholder"></footer>

  <!-- Link to scripts of your own -->
  <script src="./js/firebaseAPI_TEAM31.js"></script>
  <script src="./js/skeleton.js"></script>
  <script src="./js/script.js"></script>
  <script src="./js/schedule.js"></script>

</body>

</html>
