<!DOCTYPE html>
<html lang="en">

<head>
    <title>Routes · Commute!</title>
    <meta name="comp1800 template" content="Commute!" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/icon.png" />

    <!-- Bootstrap Library CSS CDN go here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <!-- Boostrap Library JS CDN  go here -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-------------------------------------------------------->
    <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
    <!-------------------------------------------------------->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/style_routes.css">
</head>

<body>
    <nav id="navbarPlaceholder"></nav>

    <main class="page">
        <div class="page-header">
            <div>
                <h1>Routes</h1>
                <p>The trips you take most often.</p>
            </div>
            <button class="btn btn-primary" type="button" onclick="showmodal()">
                <span class="material-symbols-rounded">add</span> Add Route
            </button>
        </div>

        <div class="modal fade" id="exampleModalLong" tabindex="-1" role="dialog" aria-labelledby="exampleModalLongTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" id="addroute" role="document">

            </div>
        </div>

        <template id="routeCardTemplate">
            <div class="col-md-6">
                <div class="surface route-card">
                    <div class="route-card-head">
                        <span class="icon-tile"><span class="material-symbols-rounded route-icon">route</span></span>
                        <div class="flex-grow-1">
                            <h2 class="card-title">Route</h2>
                            <span class="route-mode"></span>
                            <span class="route-trip"></span>
                        </div>
                        <button type="button" class="btn btn-ghost btn-sm route-edit" title="Edit Route" aria-label="Edit Route">
                            <span class="material-symbols-rounded">edit</span>
                        </button>
                        <button type="button" class="btn btn-ghost danger btn-sm route-delete" title="Delete Route" aria-label="Delete Route">
                            <span class="material-symbols-rounded">delete</span>
                        </button>
                    </div>
                    <ol class="route-stops">
                        <li class="route-start"></li>
                        <li class="route-end"></li>
                    </ol>
                    <button type="button" class="btn btn-light btn-sm route-map w-100">
                        <span class="material-symbols-rounded">map</span> Show on Map
                    </button>
                </div>
            </div>
        </template>

        <div id="routeCardGroup" class="row g-3"></div>

        <div id="routes-none" class="empty-state" hidden>
            <span class="icon-tile"><span class="material-symbols-rounded">route</span></span>
            <h2>No Routes Yet</h2>
            <p>Save a route to keep your everyday trips one tap away.</p>
            <button class="btn btn-primary" type="button" onclick="showmodal()">
                <span class="material-symbols-rounded">add</span> Add Your First Route
            </button>
        </div>
    </main>

    <!-- copyright footer -->
    <footer id="footerPlaceholder"></footer>

    <!-- Link to scripts of your own -->
    <script src="./js/firebaseAPI_TEAM31.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/directions.js"></script>
    <script src="./js/skeleton.js"></script>
    <script src="./js/routes.js"></script>
</body>

</html>
