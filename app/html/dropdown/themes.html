<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Themes · Commute!</title>
        <meta name="comp1800 template" content="Commute!" />

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="img/icon.png" />

        <!-- Bootstrap Library CSS CDN go here -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
        <!-- Boostrap Library JS CDN  go here -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

        <!-------------------------------------------------------->
        <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
        <!-------------------------------------------------------->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

        <!-- Link to styles of your own -->
        <link rel="stylesheet" href="./css/style.css">
        <script src="./js/theme.js"></script>
    </head>

    <body>
        <nav id="navbarPlaceholder"></nav>

        <main class="page page-narrow">
            <div class="page-header">
                <div>
                    <h1>Themes</h1>
                    <p>Personalize how Commute! looks.</p>
                </div>
            </div>

            <div class="theme-options" role="radiogroup" aria-label="Theme">
                <button type="button" class="surface theme-option" data-theme="system" role="radio" aria-checked="false">
                    <span class="theme-preview system"></span>
                    <span class="theme-name">
                        <span class="material-symbols-rounded">contrast</span> System
                    </span>
                    <span class="theme-hint">Match Your Device</span>
                </button>
                <button type="button" class="surface theme-option" data-theme="light" role="radio" aria-checked="false">
                    <span class="theme-preview light"></span>
                    <span class="theme-name">
                        <span class="material-symbols-rounded">light_mode</span> Light
                    </span>
                    <span class="theme-hint">Always Light</span>
                </button>
                <button type="button" class="surface theme-option" data-theme="dark" role="radio" aria-checked="false">
                    <span class="theme-preview dark"></span>
                    <span class="theme-name">
                        <span class="material-symbols-rounded">dark_mode</span> Dark
                    </span>
                    <span class="theme-hint">Always Dark</span>
                </button>
            </div>
            <p class="text-muted small mt-3">Your choice is saved on this device.</p>
        </main>

        <!-- copyright footer -->
        <footer id="footerPlaceholder"></footer>

        <!-- Link to scripts of your own -->
        <script src="./js/firebaseAPI_TEAM31.js"></script>
        <script src="./js/script.js"></script>
        <script src="./js/skeleton.js"></script>
        <script src="./js/themes.js"></script>
    </body>

</html>
