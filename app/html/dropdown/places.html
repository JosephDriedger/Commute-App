<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Places · Commute!</title>
        <meta name="comp1800 template" content="Commute!" />

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="img/icon.png" />

        <!-- Bootstrap Library CSS CDN go here -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
        <!-- Boostrap Library JS CDN  go here -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

        <!-------------------------------------------------------->
        <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
        <!-------------------------------------------------------->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

        <!-- Link to styles of your own -->
        <link rel="stylesheet" href="./css/style.css">
        <script src="./js/theme.js"></script>
        <link rel="stylesheet" href="./css/style_places.css">
    </head>

    <body>
        <nav id="navbarPlaceholder"></nav>

        <main class="page">
            <div class="page-header">
                <div>
                    <h1>Places</h1>
                    <p>Save the locations you travel to often.</p>
                </div>
                <button class="btn btn-primary" type="button" onclick="openPlaceForm()">
                    <span class="material-symbols-rounded">add</span> Add Place
                </button>
            </div>

            <template id="placeCardTemplate">
                <div class="surface place-card">
                    <span class="icon-tile"><span class="material-symbols-rounded place-icon">location_on</span></span>
                    <div class="place-body">
                        <h2 class="place-label"></h2>
                        <p class="place-address"></p>
                    </div>
                    <div class="place-actions">
                        <button type="button" class="btn btn-light btn-sm place-directions">
                            <span class="material-symbols-rounded">directions</span> Directions
                        </button>
                        <button type="button" class="btn btn-ghost btn-sm place-edit" title="Edit Place" aria-label="Edit Place">
                            <span class="material-symbols-rounded">edit</span>
                        </button>
                        <button type="button" class="btn btn-ghost danger btn-sm place-delete" title="Delete Place" aria-label="Delete Place">
                            <span class="material-symbols-rounded">delete</span>
                        </button>
                    </div>
                </div>
            </template>

            <div id="placeCardGroup" class="place-list"></div>

            <div id="places-none" class="empty-state" hidden>
                <span class="icon-tile"><span class="material-symbols-rounded">location_on</span></span>
                <h2>No Saved Places Yet</h2>
                <p>Save home, work or school once and reuse them whenever you plan a trip.</p>
                <button class="btn btn-primary" type="button" onclick="openPlaceForm()">
                    <span class="material-symbols-rounded">add</span> Add Your First Place
                </button>
            </div>
        </main>

        <!-- Add / edit place -->
        <div class="modal fade" id="placeModal" tabindex="-1" aria-labelledby="placeFormTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <form class="modal-content" id="placeForm" onsubmit="savePlace(event)">
                    <div class="modal-header">
                        <h5 class="modal-title" id="placeFormTitle">Add Place</h5>
                        <button type="button" class="btn-close" aria-label="Close" onclick="closePlaceForm()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="placeLabel" class="form-label">Name</label>
                            <input type="text" class="form-control" id="placeLabel" placeholder="Home, Work, School" required>
                        </div>
                        <div class="mb-3">
                            <label for="placeAddress" class="form-label">Address</label>
                            <input type="text" class="form-control" id="placeAddress" placeholder="5608 Clinton St, Burnaby"
                                oninput="onPlaceAddressTyped()" autocomplete="off" required>
                            <div id="placeSuggestions" class="place-suggestions"></div>
                        </div>
                        <div class="mb-3">
                            <label for="placeIcon" class="form-label">Icon</label>
                            <select id="placeIcon" class="form-select">
                                <option value="home">Home</option>
                                <option value="work">Work</option>
                                <option value="school">School</option>
                                <option value="fitness_center">Gym</option>
                                <option value="shopping_bag">Shopping</option>
                                <option value="favorite">Favourite</option>
                                <option value="location_on" selected>Other</option>
                            </select>
                        </div>
                        <p class="text-danger" id="placeMessage"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" onclick="closePlaceForm()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="savePlaceButton">Save Place</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- copyright footer -->
        <footer id="footerPlaceholder"></footer>

        <!-- Link to scripts of your own -->
        <script src="./js/firebaseAPI_TEAM31.js"></script>
        <script src="./js/script.js"></script>
        <script src="./js/skeleton.js"></script>
        <script src="./js/directions.js"></script>
        <script src="./js/places.js"></script>
    </body>

</html>
