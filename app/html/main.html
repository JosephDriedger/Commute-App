<!DOCTYPE html>
<html lang="en">

<head>
    <title>Map · Commute!</title>
    <meta name="comp1800 project" content="Commute!" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/icon.png" />

    <!-- Bootstrap Library CSS CDN go here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <!-- Boostrap Library JS CDN  go here -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-------------------------------------------------------->
    <!-- Firebase 8 Library related CSS, JS, JQuery go here -->
    <!-------------------------------------------------------->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./css/leaflet.css">

    <!-- Link to styles of your own -->
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/style_searchbar.css">
    <link rel="stylesheet" href="./css/style_map.css">
</head>

<body class="map-page">
    <nav id="navbarPlaceholder"></nav>

    <main class="map-shell">
        <div id="map"></div>

        <!-- Search card and first-run checklist, float above map -->
        <div class="overlay">
            <div id="searchbarPlaceholder"></div>
            <div id="onboarding"></div>
        </div>
    </main>

    <!-- Welcome prompt for brand new accounts -->
    <div class="modal fade" id="welcomeModal" tabindex="-1" aria-labelledby="welcomeTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center p-4">
            <img src="img/icon.png" width="56" height="56" alt="" class="welcome-logo" />
            <h2 id="welcomeTitle">Welcome to Commute!</h2>
            <p class="text-muted">Three quick steps and we can tell you when to leave.</p>
            <ol class="welcome-steps">
              <li><span class="icon-tile"><span class="material-symbols-rounded">person</span></span>Tell us how you travel</li>
              <li><span class="icon-tile accent"><span class="material-symbols-rounded">route</span></span>Save a route you take often</li>
              <li><span class="icon-tile danger"><span class="material-symbols-rounded">notifications_active</span></span>Get alerts when it is delayed</li>
            </ol>
            <div class="d-grid gap-2">
              <a class="btn btn-primary btn-lg" id="welcomeStart" href="./routes">Save Your First Route</a>
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Look Around First</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Link to scripts of your own -->
    <script src="./js/firebaseAPI_TEAM31.js"></script>
    <script src="./js/skeleton.js"></script>
    <script src="./js/directions.js"></script>
    <script src="./js/searchbar.js"></script>
    <script src="./js/script.js"></script>

    <script src="./js/onboarding.js"></script>

    <script src="./js/mapRoutes.js"></script>
    <script src="./js/webmap.js"></script>
</body>

</html>
